# Override for the repository's docker-compose.yml: the preview page, the
# agent front of one install, and the hub (ADR-0017 phase 2, GitHub sign-in
# and accounts) behind Caddy — see the Caddyfile beside this file for the
# routing and the certificates. Run from the repository root, with this file,
# the Caddyfile, the page (`site/`), the Origin CA pair (`origin/cert.pem`,
# `origin/key.pem`, mode 0600) and the GitHub OAuth App's client secret
# (`secrets/github-client-secret`, mode 0600 — see `hub/README.md` for how to
# create the app) beside docker-compose.yml. `HUB_GITHUB_CLIENT_ID` is not a
# secret (GitHub shows it in the app's settings page) but is still supplied
# from outside this file, in a `.env` file beside it:
#
#   echo 'HUB_GITHUB_CLIENT_ID=…' > .env
#   docker compose -p mcpcut-site -f docker-compose.yml -f docker-compose.site.yml up -d --build
#
# MCPCUT_SERVE_PUBLIC_URL is set on BOTH plane services before the first
# start: the container that runs `setup` first writes it into the install
# config, and `agent create` prints this address to agents.
#
# Limits: the host is shared and has two CPUs.
x-limits: &limits
  cpus: 1
  mem_limit: 1g

services:
  ui:
    <<: *limits
    environment:
      MCPCUT_SERVE_PUBLIC_URL: https://mcp.mcpcut.com:8443
  serve:
    <<: *limits
    environment:
      MCPCUT_SERVE_PUBLIC_URL: https://mcp.mcpcut.com:8443
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    environment:
      HUB_PUBLIC_URL: https://mcpcut.com
      HUB_TENANT_DOMAIN: mcpcut.com
      HUB_GITHUB_CLIENT_ID: ${HUB_GITHUB_CLIENT_ID:?set HUB_GITHUB_CLIENT_ID in a .env file beside this compose file — see hub/README.md}
      HUB_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github-client-secret
      HUB_DATA_DIR: /data
      # 0.0.0.0: the published-nowhere port below is reached only by `caddy`
      # on the compose network, the same reasoning as `ui`'s bind in the root
      # compose file.
      HUB_HOST: "0.0.0.0"
      # Set only because this container is reachable exclusively through
      # `caddy` on the compose network (H6, ADR-0017 phase 2) — never set this
      # for a hub reachable any other way, or `CF-Connecting-IP` becomes a
      # header any direct caller can forge to walk through the signup rate
      # limit (HA12).
      HUB_TRUST_CF_CONNECTING_IP: "1"
    volumes:
      - hub-data:/data
      - ./secrets/github-client-secret:/run/secrets/github-client-secret:ro
    # No `ports:`: unlike `ui`/`serve`, the hub is never meant to be reached
    # directly, not even on host loopback — only `caddy` talks to it, by
    # service name on the compose network.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      serve:
        condition: service_healthy
      hub:
        condition: service_healthy
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./origin:/etc/caddy/origin:ro
      - caddy-data:/data
volumes:
  caddy-data:
  hub-data:
