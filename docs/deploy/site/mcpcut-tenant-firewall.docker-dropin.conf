# Drop-in for docker.service: /etc/systemd/system/docker.service.d/mcpcut-tenant-firewall.conf
#
# `mcpcut-tenant-firewall.service` runs after docker.service is up, and only
# again on an explicit `systemctl restart docker` (PartOf=). Tenant containers
# (`restart: unless-stopped`) come back while dockerd starts, so without this
# drop-in they have a few seconds after boot with no rules, and after dockerd
# crashes and systemd restarts it the unit is not re-run at all. Before the
# start, the INPUT rules already hold (they match `mct+` by name); after it,
# the DOCKER-USER rules do. This narrows the boot window; it does not close
# it. The script is idempotent, so running it around every start is safe.
#
# `-`: a failure here must not keep Docker (and every site container) down;
# the unit still runs the script and fails loudly. Check the rules themselves:
#   iptables -C DOCKER-USER -i mct+ -d 169.254.0.0/16 -m comment --comment mcpcut-tenant -j DROP
[Service]
ExecStartPre=-/usr/local/sbin/mcpcut-tenant-firewall
ExecStartPost=-/usr/local/sbin/mcpcut-tenant-firewall
