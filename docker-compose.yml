# Two containers, one per long-running process of the plane:
#
#   ui     — the admin console (approvals, quarantine, servers, agents, journal)
#   serve  — the HTTP front agents talk MCP to
#
# There is deliberately no database container: the store is the built-in
# `node:sqlite` (ADR-0006), so `state.db` and `journal.db` are files opened
# in-process, not a service. Both containers therefore mount the SAME volume
# and are two writers of the same files — which is what the code already
# assumes (WAL, the O_EXCL policy lock, the `statSync` hot reload). That holds
# because a named volume is one filesystem on one host; it would NOT hold if
# these two services were scheduled onto different machines.
#
# `connect`, the stdio proxy, is not here on purpose: the agent's own client
# spawns it and speaks to it over stdin/stdout, so it has no container shape.
#
# Policy resolution (ADR-0005) tries, in order: --policy, $MCP_JOURNAL_POLICY,
# <cwd>/.mcp-journal/policy.json, <journalDir>/policy.json. The image's WORKDIR
# (/app) holds no `.mcp-journal`, so both processes land on the file in the
# volume — the same one the UI writes. Do NOT bind-mount a checkout over /app:
# a `.mcp-journal/policy.json` in it would shadow the volume's policy, and the
# console would then be editing rules the proxies do not enforce.
#
# The first start of `ui` runs `setup --yes --supervisor external` from the
# entrypoint: it writes the install config, prepares the data directory and
# mints the `owner` admin, printing that one-time token to the container's
# output. The entrypoint takes its answers from `MCPCUT_DATA_DIR`,
# `MCPCUT_UI_HOST`/`MCPCUT_UI_PORT`, `MCPCUT_SERVE_HOST`/`MCPCUT_SERVE_PORT`
# and `MCPCUT_ADMIN` — set them in an `environment:` block to change what the
# install is. Do NOT set `MCP_JOURNAL_DIR` here: it outranks the config for
# every command, so `setup` refuses the run (`dataDirConflict`) and, under
# `set -eu` with `restart: unless-stopped`, the container crash-loops.
#
# One-time owner token:   docker compose logs ui
# The console in a shell: docker compose exec -it ui mcpcut
#
# The entrypoint passes `--admin` (from `MCPCUT_ADMIN`), never `--no-admin`,
# so the bootstrap-token file `<data dir>/bootstrap-token` that a bare `ui`
# over an empty store writes (README "Admin UI") never applies here: `setup`
# mints the owner itself and the token goes to this container's stdout, as it
# always has. Behaviour unchanged; see README "Docker".
#
# Rotate the owner token after the first sign-in: it went to stdout, so a copy
# sits in this container's json-file log, readable by anyone who can run
# `docker compose logs`. The same command recovers a token that was missed:
#
#   docker compose run --rm ui admin rotate owner

name: mcp-control-plane

x-plane: &plane
  build:
    context: .
  image: mcp-control-plane:local
  volumes:
    # Mounted at $HOME/.mcp-journal, which is what src/config.ts derives
    # JOURNAL_DIR from. Both databases, the vault, policy.json and the
    # installation signing key live here.
    - mcp-data:/home/node/.mcp-journal
    # The install config, written by the entrypoint on the first start of
    # whichever service container comes first. It is a volume of its own so
    # that it survives `docker compose down` and a rebuilt image, and so that
    # a second start skips setup instead of repeating it.
    - mcp-config:/home/node/.mcpcut
  restart: unless-stopped
  # The CLI installs SIGINT/SIGTERM handlers and shuts down gracefully; give
  # in-flight batches room to commit before the daemon is killed.
  stop_grace_period: 30s
  # Bounded on purpose: the first start prints the one-time owner token to
  # stdout, so this log holds a credential until it rotates out. Three 10 MB
  # files is the ceiling on how long that copy lives.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ui:
    <<: *plane
    # The bind is not repeated as flags: it comes from `MCPCUT_UI_HOST` /
    # `MCPCUT_UI_PORT` → the config the entrypoint wrote (defaults
    # 0.0.0.0:8091). 0.0.0.0 inside the container is the only way the
    # published port reaches it; the port itself is published to host loopback
    # below, so the console is no more exposed than it was running bare. Host
    # screening still admits only localhost names — reach it at
    # http://localhost:8091.
    command: ["ui"]
    ports:
      - "127.0.0.1:8091:8091"
    # `ui` spawns registry MCP servers too — the connection probe (ADR-0008)
    # starts a stdio server to ask it `initialize`; PID 1 must reap them or
    # the container accumulates zombies.
    init: true
    healthcheck:
      # GET /login is the one public route, so it exercises the whole stack
      # (listener, router, renderer) rather than just the socket.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  serve:
    <<: *plane
    # Same source as `ui` above: `MCPCUT_SERVE_HOST` / `MCPCUT_SERVE_PORT` →
    # the config the entrypoint wrote (defaults 0.0.0.0:8090).
    command: ["serve"]
    # `ui` writes the install config on its first start; waiting for it to be
    # healthy means `serve` finds the config already there instead of both
    # containers racing to run `setup` (the entrypoint's file check makes the
    # race harmless, not impossible).
    depends_on:
      ui:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    # `serve` spawns registry MCP servers as child processes; PID 1 must reap
    # them or the container accumulates zombies.
    init: true
    healthcheck:
      # Every route of the agent front is authenticated, so there is no public
      # response to assert on: this checks that the listener is accepting.
      test: ["CMD", "node", "-e", "require('node:net').connect(8090, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mcp-data:
  mcp-config:
