name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release (release.yml) runs this same CI before it stages a version.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A real Postgres for the file module's index tests (they skip without it).
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mcpcut
          POSTGRES_PASSWORD: mcpcut-test
          POSTGRES_DB: mcpcut_test
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U mcpcut -d mcpcut_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Build hub
        run: npm run build:hub

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          MCPCUT_TEST_PG_URL: postgres://mcpcut:mcpcut-test@127.0.0.1:55439/mcpcut_test
